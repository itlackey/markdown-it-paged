name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty for latest commit)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="${INPUT_TAG#refs/tags/}"
            if [[ "$TAG_NAME" != v* ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            echo "ref=refs/tags/$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_REF_VALUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish

      - name: Resolve release metadata
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="${INPUT_TAG#refs/tags/}"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_VALUE#refs/tags/}"
          else
            TAG_NAME="v$(node -p "require('./package.json').version.replace(/^v/, '')")"
          fi

          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v$TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          release_name: Release ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ steps.release.outputs.target_commitish }}
          body: |
            Release ${{ steps.release.outputs.tag_name }}

            Published to npm: https://www.npmjs.com/package/markdown-it-paged/v/${{ steps.release.outputs.package_version }}
          draft: false
          prerelease: false
